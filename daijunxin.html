<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>戴俊欣工作台</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <meta name="theme-color" content="#fdfbf7">
    <style>
        :root {
            --primary: #fdfbf7;
            --secondary: #fffcf8;
            --accent: #e6d5c3;
            --accent-dark: #d4c4a8;
            --text-primary: #3d3d3d;
            --text-secondary: #8a8a8a;
            --text-muted: #c4c0b8;
            --success: #48a848;
            --warning: #d4a82f;
            --danger: #d94848;
            --pink: #d46b8a;
            --pink-light: #ffeef5;
            --blue: #6b9bd4;
            --purple: #a87cd4;
            --border-radius: 16px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.1);
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #fffcf8 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }

        .sidebar {
            width: 280px;
            background: rgba(255, 252, 248, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(230, 213, 195, 0.3);
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.03);
        }

        .sidebar-header {
            padding: 28px 24px;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #fff5e6 0%, #fffcf8 100%);
            border-radius: var(--border-radius);
            box-shadow: 0 8px 24px rgba(255, 245, 230, 0.5);
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #5c4b3a;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .sidebar-header p {
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.8;
        }

        .menu-list {
            list-style: none;
            padding: 0;
        }

        .menu-item {
            margin-bottom: 4px;
        }

        .menu-item button {
            width: 100%;
            padding: 14px 20px;
            border: none;
            background: transparent;
            border-radius: var(--border-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .menu-item button::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--pink) 0%, var(--accent-dark) 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .menu-item button:hover {
            background: rgba(230, 213, 195, 0.2);
            color: var(--text-primary);
            transform: translateX(4px);
        }

        .menu-item button:hover::before {
            opacity: 1;
        }

        .menu-item button.active {
            background: linear-gradient(135deg, rgba(212, 107, 138, 0.1) 0%, rgba(230, 213, 195, 0.1) 100%);
            color: var(--pink);
            font-weight: 600;
        }

        .menu-item button.active::before {
            opacity: 1;
        }

        .content {
            flex: 1;
            margin-left: 280px;
            padding: 32px;
            min-height: 100vh;
            overflow-y: auto;
        }

        .page {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: #fff;
            border-radius: var(--border-radius);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(230, 213, 195, 0.2);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(230, 213, 195, 0.3);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--pink) 0%, #c45a7a 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(212, 107, 138, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(212, 107, 138, 0.4);
        }

        .btn-secondary {
            background: rgba(230, 213, 195, 0.4);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(230, 213, 195, 0.6);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: rgba(230, 213, 195, 0.2);
            color: var(--text-primary);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-success {
            background: rgba(72, 168, 72, 0.15);
            color: var(--success);
        }

        .btn-warning {
            background: rgba(212, 168, 47, 0.15);
            color: var(--warning);
        }

        .btn-danger {
            background: rgba(217, 72, 72, 0.15);
            color: var(--danger);
        }

        .btn-platform {
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-douyin {
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            color: #fff;
        }

        .btn-xiaohongshu {
            background: linear-gradient(135deg, #ff2442 0%, #ff6b6b 100%);
            color: #fff;
        }

        .btn-bilibili {
            background: linear-gradient(135deg, #00a1d6 0%, #3b82f6 100%);
            color: #fff;
        }

        .btn-zhihu {
            background: linear-gradient(135deg, #0084ff 0%, #0066cc 100%);
            color: #fff;
        }

        .btn-cnki {
            background: linear-gradient(135deg, #2385bb 0%, #1a6fa5 100%);
            color: #fff;
        }

        .btn-gov {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: #fff;
        }

        .btn-baidu {
            background: linear-gradient(135deg, #2932e1 0%, #1a237e 100%);
            color: #fff;
        }

        .btn-jjwxc {
            background: linear-gradient(135deg, #d46b8a 0%, #b85270 100%);
            color: #fff;
        }

        .input {
            padding: 10px 14px;
            border: 1px solid rgba(230, 213, 195, 0.5);
            border-radius: 12px;
            font-size: 14px;
            width: 100%;
            background: rgba(255, 252, 248, 0.5);
            color: var(--text-primary);
            transition: var(--transition);
        }

        .input:focus {
            outline: none;
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(212, 107, 138, 0.1);
        }

        .select {
            padding: 10px 14px;
            border: 1px solid rgba(230, 213, 195, 0.5);
            border-radius: 12px;
            font-size: 14px;
            width: 100%;
            background: rgba(255, 252, 248, 0.5);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .select:focus {
            outline: none;
            border-color: var(--pink);
        }

        .text-area {
            padding: 12px 14px;
            border: 1px solid rgba(230, 213, 195, 0.5);
            border-radius: 12px;
            font-size: 14px;
            width: 100%;
            background: rgba(255, 252, 248, 0.5);
            color: var(--text-primary);
            resize: vertical;
            min-height: 100px;
            transition: var(--transition);
        }

        .text-area:focus {
            outline: none;
            border-color: var(--pink);
            box-shadow: 0 0 0 3px rgba(212, 107, 138, 0.1);
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .three-columns {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .priority-high { color: var(--danger); background: rgba(217, 72, 72, 0.1); }
        .priority-medium { color: var(--warning); background: rgba(212, 168, 47, 0.1); }
        .priority-low { color: var(--success); background: rgba(72, 168, 72, 0.1); }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255, 252, 248, 0.8);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .todo-item:hover {
            border-color: rgba(230, 213, 195, 0.4);
            background: #fff;
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .todo-text {
            flex: 1;
            font-size: 14px;
            color: var(--text-primary);
        }

        .todo-actions {
            display: flex;
            gap: 6px;
        }

        .progress-bar {
            height: 8px;
            background: rgba(230, 213, 195, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .progress-fill.pink { background: linear-gradient(90deg, var(--pink) 0%, #c45a7a 100%); }
        .progress-fill.blue { background: linear-gradient(90deg, var(--blue) 0%, #5a8bd4 100%); }
        .progress-fill.green { background: linear-gradient(90deg, var(--success) 0%, #3a983a 100%); }
        .progress-fill.purple { background: linear-gradient(90deg, var(--purple) 0%, #986cd4 100%); }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
            background: rgba(255, 252, 248, 0.8);
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
            border: 1px solid rgba(230, 213, 195, 0.2);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--pink);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .video-container {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            margin: 16px 0;
            aspect-ratio: 16/9;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(230, 213, 195, 0.3);
            padding-bottom: 8px;
        }

        .tab {
            padding: 8px 20px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .tab.active {
            background: rgba(212, 107, 138, 0.1);
            color: var(--pink);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: rgba(255, 252, 248, 0.8);
            border-radius: 12px;
            margin-bottom: 12px;
            transition: var(--transition);
            cursor: pointer;
        }

        .ranking-item:hover {
            background: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        .rank-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--pink) 0%, #c45a7a 100%);
            color: #fff;
        }

        .rank-badge.gold { background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%); }
        .rank-badge.silver { background: linear-gradient(135deg, #c0c0c0 0%, #a8a8a8 100%); }
        .rank-badge.bronze { background: linear-gradient(135deg, #cd7f32 0%, #a0522d 100%); }

        .ranking-info {
            flex: 1;
        }

        .ranking-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .ranking-meta {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .quick-add-form {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .quick-add-form .input {
            flex: 1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fff;
            border-radius: var(--border-radius);
            padding: 24px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(230, 213, 195, 0.3);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .modal-close:hover {
            color: var(--text-secondary);
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .highlight {
            background: linear-gradient(135deg, rgba(212, 107, 138, 0.1) 0%, rgba(230, 213, 195, 0.1) 100%);
            border-left: 4px solid var(--pink);
            padding: 12px 16px;
            border-radius: 0 12px 12px 0;
            margin: 16px 0;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-nav button {
            padding: 8px 16px;
            background: rgba(230, 213, 195, 0.3);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .calendar-nav button:hover {
            background: rgba(230, 213, 195, 0.5);
            color: var(--text-primary);
        }

        .calendar-nav span {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid rgba(230, 213, 195, 0.3);
                padding: 16px;
            }

            .content {
                margin-left: 0;
                padding: 16px;
                margin-top: 0;
            }

            .two-columns, .three-columns {
                grid-template-columns: 1fr;
            }

            .menu-item button {
                padding: 12px 16px;
                font-size: 14px;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>✨ 戴俊欣工作台</h1>
            <p>效率工具，助力成长</p>
        </div>
        <ul class="menu-list" id="menu-list"></ul>
    </div>

    <div class="content">
        <div id="page-todo" class="page active"></div>
        <div id="page-teaching" class="page"></div>
        <div id="page-novel" class="page"></div>
        <div id="page-drive" class="page"></div>
        <div id="page-fund" class="page"></div>
        <div id="page-insurance" class="page"></div>
        <div id="page-makeup" class="page"></div>
        <div id="page-sports" class="page"></div>
        <div id="page-calligraphy" class="page"></div>
        <div id="page-review" class="page"></div>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">弹窗标题</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script>
        const menuItems = [
            { id: 'todo', icon: '📋', name: '每日计划' },
            { id: 'teaching', icon: '🏫', name: '教学管理' },
            { id: 'novel', icon: '📖', name: '小说拆解' },
            { id: 'drive', icon: '🚗', name: '开车知识' },
            { id: 'fund', icon: '📈', name: '基金知识' },
            { id: 'insurance', icon: '🛡️', name: '保险知识' },
            { id: 'makeup', icon: '💄', name: '化妆知识' },
            { id: 'sports', icon: '🏃', name: '运动知识' },
            { id: 'calligraphy', icon: '✍️', name: '练字字帖' },
            { id: 'review', icon: '🔄', name: '每日复盘' }
        ];

        function getStore(key, defaultValue) {
            try {
                const value = localStorage.getItem(key);
                return value ? JSON.parse(value) : defaultValue;
            } catch {
                return defaultValue;
            }
        }

        function setStore(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function formatDate(date) {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            return date.toLocaleDateString('zh-CN', options);
        }

        function initMenu() {
            const list = document.getElementById('menu-list');
            menuItems.forEach(item => {
                const li = document.createElement('li');
                li.className = 'menu-item';
                li.innerHTML = `<button onclick="switchPage('${item.id}')" id="menu-${item.id}">
                    <span>${item.icon}</span>
                    <span>${item.name}</span>
                </button>`;
                list.appendChild(li);
            });
            document.getElementById('menu-todo').classList.add('active');
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-item button').forEach(b => b.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.getElementById(`menu-${pageId}`).classList.add('active');
        }

        function openModal(title, body, footer) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = body;
            document.getElementById('modal-footer').innerHTML = footer;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        // ==================== 每日计划模块 ====================
        let currentMonth = new Date();

        function renderDate() {
            return formatDate(new Date());
        }

        window.changeMonth = function(offset) {
            currentMonth.setMonth(currentMonth.getMonth() + offset);
            renderTodoPage();
        }

        function getMonthKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
        }

        function getTodos() {
            return getStore('todos', [
                { id: 1, text: '完成小说拆解任务', priority: 'high', completed: false },
                { id: 2, text: '备课教学计划', priority: 'medium', completed: false },
                { id: 3, text: '运动打卡', priority: 'low', completed: false }
            ]);
        }

        function saveTodos(todos) {
            setStore('todos', todos);
        }

        function addTodo(text, priority) {
            const todos = getTodos();
            todos.push({
                id: Date.now(),
                text,
                priority,
                completed: false
            });
            saveTodos(todos);
            renderTodoPage();
        }

        function toggleTodo(id) {
            const todos = getTodos();
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos(todos);
                renderTodoPage();
            }
        }

        function deleteTodo(id) {
            const todos = getTodos().filter(t => t.id !== id);
            saveTodos(todos);
            renderTodoPage();
        }

        function getMonthTodos() {

        function moveFocusWork(id, direction) {
            const works = getFocusWorks();
            const index = works.findIndex(w => w.id === id);
            if (index === -1) return;
            
            const targetIndex = direction === 'up' ? index - 1 : index + 1;
            if (targetIndex < 0 || targetIndex >= works.length) return;
            
            [works[index], works[targetIndex]] = [works[targetIndex], works[index]];
            works.forEach((w, i) => w.order = i + 1);
            saveFocusWorks(works);
            renderTodoPage();
        }

        function deleteFocusWork(id) {
            const works = getFocusWorks().filter(w => w.id !== id);

                    <div style="text-align: center; padding: 20px;">
                        <p style="font-size: 16px; color: var(--success); font-weight: 500;">💪 ${motivation}</p>
                    </div>
                </div>
            `;
        }

        function showVideoSummary() {
            openModal(
                '视频动作总结',
                `<ul style="padding-left: 20px;">
                    <li style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">• <strong>热身阶段</strong>：活动全身关节，避免运动损伤</li>
                    <li style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">• <strong>有氧阶段</strong>：提高心率，燃烧卡路里</li>
                    <li style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">• <strong>力量阶段</strong>：增强肌肉力量，塑造体型</li>
                    <li style="margin-bottom: 12px; font-size: 14px; color: var(--text-secondary);">• <strong>拉伸阶段</strong>：放松肌肉，缓解酸痛</li>
                </ul>`,
                `<button class="btn btn-primary" onclick="closeModal()">知道了</button>`
            );
        }

        // ==================== 练字字帖模块 ====================
        const calligraphyFonts = [
            { name: '正楷', sample: '永字八法：点、横、竖、撇、捺、折、钩、提。正楷字体端庄稳重，笔画清晰有力，适合初学者。', keyword: '正楷字帖' },
            { name: '行楷', sample: '行楷介于楷书和行书之间，笔画流畅自然，既有楷书的工整，又有行书的灵动。书写时注意笔画的连贯和呼应。', keyword: '行楷字帖' },
            { name: '隶书', sample: '隶书是汉字书法中重要的字体之一，笔画蚕头燕尾，古朴典雅。书写时注意横画的波磔和结构的扁平。', keyword: '隶书字帖' }
        ];

        function printCalligraphy(fontName) {
            const articleContent = {
                '正楷': '永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹；又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。是日也，天朗气清，惠风和畅，仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。',
                '行楷': '豫章故郡，洪都新府。星分翼轸，地接衡庐。襟三江而带五湖，控蛮荆而引瓯越。物华天宝，龙光射牛斗之墟；人杰地灵，徐孺下陈蕃之榻。雄州雾列，俊采星驰。台隍枕夷夏之交，宾主尽东南之美。都督阎公之雅望，棨戟遥临；宇文新州之懿范，襜帷暂驻。十旬休假，胜友如云；千里逢迎，高朋满座。',
                '隶书': '君讳全，字景完，敦煌效谷人也。其先盖周之胄，武王秉乾之机，翦伐殷商，既定尔勋，福禄攸同，封弟叔振铎于曹国，因氏焉。秦汉之际，曹参夹辅王室，世宗廓土斥竟，子孙迁于雍州之郊，分止右扶风，或在安定，或处武都，或居陇西，或家敦煌。'
            };

            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${fontName}字帖</title>
                    <style>
                        body { font-family: 'KaiTi', 'STKaiti', serif; font-size: 18px; line-height: 2; padding: 40px; text-align: justify; }
                        .title { text-align: center; font-size: 24px; font-weight: bold; margin-bottom: 30px; }
                    </style>
                </head>
                <body>
                    <div class="title">${fontName}字帖 - 临摹练习</div>
                    <div>${articleContent[fontName]}</div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        function showCalligraphyTip() {
            alert('请使用打印的字帖纸进行书写练习！\n\n练习建议：\n1. 先观察字形结构\n2. 注意笔画顺序\n3. 控制书写速度\n4. 保持坐姿端正');
        }

        function renderCalligraphyPage() {
            document.getElementById('page-calligraphy').innerHTML = `
                <div class="card" style="background: linear-gradient(135deg, #fffef0 0%, #fffcf8 100%); border: none;">
                    <div class="card-header">
                        <h2 class="card-title" style="font-size: 22px;">✍️ 练字字帖</h2>
                    </div>
                </div>

                <div class="three-columns">
                    ${calligraphyFonts.map(font => `
                        <div class="card">
                            <h4 style="font-size: 16px; font-weight: 600; margin-bottom: 12px; text-align: center; color: var(--text-primary);">${font.name}</h4>
                            <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px;">${font.sample}</p>
                            <div style="display: flex; gap: 8px;">
                                <button class="btn btn-primary" onclick="printCalligraphy('${font.name}')" style="flex: 1;">打印临摹</button>
                                <a href="https://www.baidu.com/s?wd=${encodeURIComponent(font.keyword)}" target="_blank" class="btn-platform btn-baidu">🔍 搜索</a>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">📝 田字格练习区</h3>
                    </div>
                    <div id="tian-zi-ge" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: #ccc; padding: 1px; border-radius: 8px; max-width: 320px; margin: 0 auto; cursor: pointer;" onclick="showCalligraphyTip()"></div>
                    <p style="text-align: center; margin-top: 12px; font-size: 14px; color: var(--text-secondary);">点击田字格查看提示</p>
                </div>
            `;
            renderTianZiGe();
        }

        function renderTianZiGe() {
            const container = document.getElementById('tian-zi-ge');
            let html = '';
            for (let i = 0; i < 25; i++) {
                html += '<div style="aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center; position: relative;"><span style="position: absolute; width: 100%; height: 1px; background: #ccc;"></span><span style="position: absolute; width: 1px; height: 100%; background: #ccc;"></span></div>';
            }
            container.innerHTML = html;
        }

        // ==================== 每日复盘模块 ====================
        function renderReviewPage() {
            const todos = getTodos();
            const completedCount = todos.filter(t => t.completed).length;
            const incompleteCount = todos.filter(t => !t.completed).length;
            const review = getStore('daily_review', '');
            const reviewOptions = getStore('review_options', {});

            document.getElementById('page-review').innerHTML = `
                <div class="card" style="background: linear-gradient(135deg, #f5f0ff 0%, #fffcf8 100%); border: none;">
                    <div class="card-header">
                        <h2 class="card-title" style="font-size: 22px;">🔄 每日复盘</h2>
                        <div style="display: flex; gap: 20px;">
                            <div class="stat-card" style="background: rgba(255,255,255,0.8);">
                                <div class="stat-value" style="color: var(--success);">${completedCount}</div>
                                <div class="stat-label">已完成</div>
                            </div>
                            <div class="stat-card" style="background: rgba(255,255,255,0.8);">
                                <div class="stat-value" style="color: var(--danger);">${incompleteCount}</div>
                                <div class="stat-label">未完成</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">📝 任务反思</h3>
                    </div>
                    <div>
                        ${todos.length > 0 ? todos.map(todo => `
                            <div class="todo-item" ${todo.completed ? 'style="opacity: 0.6;"' : ''}>
                                <input type="checkbox" ${todo.completed ? 'checked disabled' : ''}>
                                <span class="todo-text">${todo.text}</span>
                                <div style="display: flex; gap: 8px;">
                                    <select class="select" style="width: auto; padding: 4px 8px; font-size: 12px;" onchange="saveReviewOption(${todo.id}, 'rating', this.value)">
                                        <option value="">专注度评分</option>
                                        <option value="5" ${reviewOptions[todo.id]?.rating === '5' ? 'selected' : ''}>⭐⭐⭐⭐⭐</option>
                                        <option value="4" ${reviewOptions[todo.id]?.rating === '4' ? 'selected' : ''}>⭐⭐⭐⭐</option>
                                        <option value="3" ${reviewOptions[todo.id]?.rating === '3' ? 'selected' : ''}>⭐⭐⭐</option>
                                        <option value="2" ${reviewOptions[todo.id]?.rating === '2' ? 'selected' : ''}>⭐⭐</option>
                                        <option value="1" ${reviewOptions[todo.id]?.rating === '1' ? 'selected' : ''}>⭐</option>
                                    </select>
                                    <select class="select" style="width: auto; padding: 4px 8px; font-size: 12px;" onchange="saveReviewOption(${todo.id}, 'status', this.value)">
                                        <option value="">状态</option>
                                        <option value="good" ${reviewOptions[todo.id]?.status === 'good' ? 'selected' : ''}>做得很好</option>
                                        <option value="improve" ${reviewOptions[todo.id]?.status === 'improve' ? 'selected' : ''}>需要改进</option>
                                        <option value="continue" ${reviewOptions[todo.id]?.status === 'continue' ? 'selected' : ''}>明日继续</option>
                                    </select>
                                </div>
                            </div>
                        `).join('') : '<p style="text-align: center; color: var(--text-muted); padding: 20px;">暂无待办事项可复盘</p>'}
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">📊 今日总结</h3>
                    </div>
                    <textarea class="text-area" id="daily-review" placeholder="总结今日的收获、不足和明日计划..." oninput="saveReview(this.value)">${review}</textarea>
                </div>
            `;
        }

        function saveReviewOption(todoId, key, value) {
            const options = getStore('review_options', {});
            if (!options[todoId]) {
                options[todoId] = {};
            }
            options[todoId][key] = value;
            setStore('review_options', options);
        }

        function saveReview(value) {
            setStore('daily_review', value);
        }

        // ==================== 初始化 ====================
        function init() {
            initMenu();
            renderTodoPage();
            renderTeachingPage();
            renderNovelPage();
            renderDrivePage();
            renderFundPage();
            renderInsurancePage();
            renderMakeupPage();
            renderSportsPage();
            renderCalligraphyPage();
            renderReviewPage();
        }

        init();
    </script>
</body>
</html>
